services:
  siae-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://siae-app:8080
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
        NEXT_PUBLIC_VAPID_KEY: ${NEXT_PUBLIC_VAPID_KEY:-}
    container_name: siae-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      BACKEND_API_URL: http://siae-app:8080
    networks:
      - default
      - grpc_default

networks:
  default:
  grpc_default:
    external: true
